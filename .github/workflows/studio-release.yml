name: Publish Studio release

on:
  workflow_run:
    workflows:
      - Studio Windows build
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: studio-release-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Publish verified Windows installers
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'studio-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download installers from the successful Windows build
        uses: actions/download-artifact@v4
        with:
          name: kardecagent-studio-windows
          path: release-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release payload is complete
        shell: bash
        run: |
          test -f release-artifacts/studio-build-manifest.json
          find release-artifacts -type f -name '*.msi' -print -quit | grep -q .
          find release-artifacts -type f -name '*.exe' -print -quit | grep -q .
          echo "Verified installer artifact and build manifest."

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          name: KardecAgent Studio ${{ github.event.workflow_run.head_branch }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
            release-artifacts/studio-build-manifest.json
