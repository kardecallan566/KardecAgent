<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111318" />
    <title>KardecAgent Studio</title>
    <style>
      html, body { margin: 0; min-width: 320px; min-height: 100%; background: #111318; color: #e7e9ef; font-family: "Segoe UI", system-ui, sans-serif; }
      #root { min-height: 100vh; }
      .startup-loading { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; color: #aeb4c1; font-size: 13px; }
      .startup-loading-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 11px; background: #28233a; color: #b7a5ff; font-weight: 800; font-size: 22px; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup-loading" role="status">
        <div class="startup-loading-mark">K</div>
        <strong>KardecAgent Studio</strong>
        <span>Carregando a interface…</span>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
