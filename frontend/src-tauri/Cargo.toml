[package]
name = "kardecagent-studio"
version = "0.1.0"
description = "KardecAgent Studio desktop shell"
authors = ["KardecAgent"]
edition = "2021"

[lib]
name = "kardecagent_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"